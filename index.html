
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>TODO TASK WITH FETCH</title>

    <style>

    .spinner{
    display: flex;
    justify-content: center;
    align-items: center;
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(92, 88, 210, 0.8);   
    }

    </style>
 
</head>

<body>
    <h1 class="text-center text-white bg-dark p-3">TODO TASK WITH FETCH</h1>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-6 offset-3 mb-4">
                <div class="card">
                    <div class="card-header text-white bg-dark text-center">
                        <h3>Add Your Todo</h3>
                    </div>

                    <div class="card-body">
                        <form id="todoForm">
                            <div class="form-group">
                                <label for="todoInput">Todo Item</label>
                                <input required type="text" id="todoInput" class="form-control">
                            </div>

                            <button class="btn btn-sm btn-block btn-outline-primary" id="addTodoBtn">Add Todo</button>
                            <button type="button" class="btn btn-sm btn-block btn-outline-danger d-none"
                                id="updateTodoBtn">Update Todo</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8 offset-2">
                <div class="card">
                    <div class="card-header text-center text-white bg-info">
                        <h3>Your Todo</h3>
                    </div>

                    <div class="card-body">
                        <ul class="list-group" id="todoContainer">
                            <!-- <li class="list-group-item d-flex justify-content-between">
                                <strong>Html</strong>
                                <div>
                                    <button class="btn btn-sm btn-outline-info">Edit</button>
                                    <button class="btn btn-sm btn-outline-danger">Remove</button>
                                </div>
                            </li> -->
                        </ul>
                    </div>
                </div>

            </div>

        </div>
    </div>



       <div class="spinner d-none" id="spinner">
        <div class="spinner-border text-secondary" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
